name: publish-private-packages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.401

      - name: Configure private dependency feed
        env:
          LWXLABS_PACKAGES_TOKEN: ${{ secrets.LWXLABS_PACKAGES_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          token="${LWXLABS_PACKAGES_TOKEN:-$GITHUB_TOKEN}"
          dotnet nuget update source GitHub \
            --source "https://nuget.pkg.github.com/lwxlabs/index.json" \
            --username "${{ github.actor }}" \
            --password "$token" \
            --store-password-in-clear-text \
            --configfile NuGet.config

      - name: Build, test and pack
        run: ./build/pack.sh

      - name: Publish preview packages to the private GitHub feed
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet nuget update source GitHub \
            --source "https://nuget.pkg.github.com/lwxlabs/index.json" \
            --username "${{ github.actor }}" \
            --password "$GH_PACKAGES_TOKEN" \
            --store-password-in-clear-text \
            --configfile NuGet.config
          shopt -s nullglob
          packages=(artifacts/release/*.nupkg)
          test "${#packages[@]}" -eq 5
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/lwxlabs/index.json" \
              --api-key "$GH_PACKAGES_TOKEN" \
              --skip-duplicate
          done
